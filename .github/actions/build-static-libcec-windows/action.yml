name: build-libcec-windows
description: Builds libcec on Windows environments.

inputs:
  arch:
    description: The architecture being built.
    required: true
  build_type:
    description: The build type, either "release" or "debug".
    required: true
  visual_studio_version:
    description: The Visual Studio version to use.
    required: true

outputs:
  static_binary_path:
    description: The freshly-built binary path for static build
    value: ${{ steps.set_output.outputs.static_binary_path }}
  dynamic_binary_path:
    description: The freshly-built binary path for dynamic build
    value: ${{ steps.set_output.outputs.dynamic_binary_path }}

runs:
  using: composite
  steps:
    - name: Checkout libcec
      uses: actions/checkout@v4
      with:
        path: libcec
        submodules: recursive
    # for git-describe to work, needed to embed version from git tag
    - run: cd libcec && git fetch --prune --unshallow --tags --recurse-submodules=no
      shell: bash

    - name: Setup developer command prompt
      uses: ilammy/msvc-dev-cmd@v1

    - name: Build libcec
      shell: pwsh
      env:
        CL: /MP
      run: |
        Set-PSDebug -Strict
        Set-PSDebug -Trace 2

        echo 'setting up build environment...'
        mkdir -p '${{ github.workspace }}\libcec\build'
        mkdir -p '${{ github.workspace }}\libcec\dist'

        [string[]] $script_paths = @(
          '${{ github.workspace }}\libcec\windows\build-lib.cmd'
        )

        [string] $build_type = if ( '${{ inputs.build_type }}' -eq 'debug' ) {
          'Debug'
        } elseif ( '${{ inputs.build_type }}' -eq 'release' ) {
          'RelWithDebInfo'
        } else {
          throw "invalid build type"
        }

        [string[]] $script_args = @(
          'amd64'
          $build_type
          '${{ inputs.visual_studio_version }}'
          '"${{ github.workspace }}\libcec\build"'
          'nmake'
        )

        foreach ($script_path in $script_paths) {
          &"$script_path" $script_args
        }

        echo "copying binaries to dist..."

        Get-ChildItem -Recurse -Path '${{ github.workspace }}\libcec\build' -Include *.lib,*.pdb |
          Copy-Item -Destination '${{ github.workspace }}\libcec\static-dist'
        Copy-Item -Recurse -Path '${{ github.workspace }}\libcec\include' -Destination '${{ github.workspace }}\libcec\static-dist'

        Get-ChildItem -Recurse -Path '${{ github.workspace }}\libcec\build' -Include *.dll,*.pdb |
          Copy-Item -Destination '${{ github.workspace }}\libcec\dynamic-dist'
        Copy-Item -Recurse -Path '${{ github.workspace }}\libcec\include' -Destination '${{ github.workspace }}\libcec\dynamic-dist'

        echo "build output (for debug)"
        Get-ChildItem -Path ${{ github.workspace }}\libcec -Recurse –File

    - name: Set dynamic output
      id: set_output
      shell: bash
      run: |
        echo "dynamic_binary_path=${{ github.workspace }}\libcec\dynamic-dist" >> $GITHUB_OUTPUT
        echo "static_binary_path=${{ github.workspace }}\libcec\static-dist" >> $GITHUB_OUTPUT